plugins { id 'com.android.application' }

android {
    namespace 'com.openai.uvcard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.uvcard'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '1.2-V9.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
